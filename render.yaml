services:
  - type: web
    name: codepath-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://zwagbbmxckiinpacawkr.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL_NAME
        value: gemini-flash-lite-latest
      - key: GOOGLE_PROJECT_NUMBER
        value: "755501377530"
      - key: AI_API_KEY
        sync: false
      - key: CODE_EXECUTION_SANDBOX_ENABLED
        value: "True"
      - key: CODE_EXECUTION_TIMEOUT_SECONDS
        value: "8"

  - type: web
    name: codepath-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_API_URL
        value: https://codepath-backend-s8tj.onrender.com/api/v1
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://zwagbbmxckiinpacawkr.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_ZyOP2Eu5R4C1cMDLhPWjXw_BqUMOCcK
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_ZyOP2Eu5R4C1cMDLhPWjXw_BqUMOCcK
      - key: NEXT_PUBLIC_APP_NAME
        value: CodePath
      - key: NEXT_PUBLIC_APP_TAGLINE
        value: "Learn to Code. Build Projects. Become Career Ready."

