services:
  - type: web
    name: codepath-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://zwagbbmxckiinpacawkr.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: CODE_EXECUTION_SANDBOX_ENABLED
        value: "True"
      - key: CODE_EXECUTION_TIMEOUT_SECONDS
        value: "8"
